strategy: 
   - multibagger
  # - earlymb
  # - aggresive
  # - balance
  # - value

files:
  # - data/qtum.xlsx

top_n: 
  - 20
  # - 50
  # - 100
capital: 
  - 100000
  # - 500000
  # - 1000000
purchase_date: 
  - "2026-01-01"
  # - "2026-02-01"

rebalance_tolerance_pct:
  - 0.25

hysteresis_rank_buffer:
  - 5

# Smart Hysteresis (Hybrid 3A + 3B)
hysteresis_min_score_delta: 3.0              # New candidate in top N displaces buffer holding if score advantage >= 3.0 pts
hysteresis_require_growth_acceleration: true # Buffer grace forfeited if holding has decelerating revenue growth (TTM < 3Y CAGR)

cooldown_days:
  - 30

cooldown_bypass_rank:
  - 5

# Tier-3 Sentry Gate & Technical Protection
sentry: true                                  # Upstream Sentry Gate: filters out falling knives (price < 0.95*SMA200 / >20% DD)
# staged_path: data/pre_microsmall.csv        # (Optional) Uncomment to swap decaying holdings from staged bullpen instead of in-strategy waterfall
strict_sector: false                          # Set to true to strictly cap max 3 stocks per sector in substitutions

# Sector-specific stock count caps (e.g. limit liquor / Consumer Defensive to 2)
sector_max_stocks:
  Consumer Defensive: 2

# Quality Hurdle & Hybrid Cash Trigger
min_entry_score: 40.0                         # Hard score hurdle for new candidate additions
min_holding_score: 35.0                       # Eviction floor for existing holdings in buffer
max_stock_weight_cap: 0.06                    # Single-stock weight ceiling (6.0%)
allow_cash_reserve: true                      # Unallocated weight spills into CASH_RESERVE

# Broker configuration
broker: zerodha                     # "zerodha" (default) or "schwab"
# schwab_config: config/schwab.json   # Schwab app credentials
# schwab_token: config/schwab_token.json  # Schwab OAuth tokens (auto-managed)

# Autopilot scheduling
