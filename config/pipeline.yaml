# ==============================================================================
# MyCase Portfolio Pipeline Configuration
# Profile-Driven Execution Engine
# ==============================================================================

# Default profile when running `mycase pipeline` with no flags
default_profile: india-multibagger

profiles:
  # ============================================================================
  # INDIA: Multibagger Compounder Profile
  # ============================================================================
  india-multibagger:
    indices:
      - niftytotalmarket
    golden_copy_path: data/microsmall.csv
    strategy: multibagger
    top_n: 20
    capital: 100000
    purchase_date: "2026-01-01"
    rebalance_tolerance_pct: 0.25
    hysteresis_rank_buffer: 5
    hysteresis_min_score_delta: 3.0
    hysteresis_require_growth_acceleration: true
    cooldown_days: 30
    cooldown_bypass_rank: 5
    sentry: true
    strict_sector: false
    sector_max_stocks:
      Consumer Defensive: 2
    min_entry_score: 40.0
    min_holding_score: 35.0
    max_stock_weight_cap: 0.06
    allow_cash_reserve: true
    broker: zerodha

  # ============================================================================
  # INDIA: Early Multibagger (EBM) Breakout Profile
  # ============================================================================
  india-earlymb:
    indices:
      - niftytotalmarket
    golden_copy_path: data/earlymb_live.csv
    strategy: earlymb
    top_n: 12
    capital: 100000
    purchase_date: "2026-01-01"
    rebalance_tolerance_pct: 0.25
    hysteresis_rank_buffer: 5
    hysteresis_min_score_delta: 3.0
    hysteresis_require_growth_acceleration: true
    cooldown_days: 30
    cooldown_bypass_rank: 5
    sentry: true
    strict_sector: false
    broker: zerodha

  # ============================================================================
  # USA: Quality Momentum Compounder Profile
  # ============================================================================
  us-momentum:
    indices:
      - sp500
    golden_copy_path: data/us_portfolio.csv
    strategy: us_quality_momentum
    top_n: 20
    capital: 100000
    rebalance_tolerance_pct: 0.25
    hysteresis_rank_buffer: 5
    hysteresis_min_score_delta: 3.0
    sentry: false
    broker: schwab
    schwab_config: config/schwab.json
    schwab_token: config/schwab_token.json

# Top-level fallback settings for legacy backwards compatibility
indices:
  - niftytotalmarket
golden_copy_path: data/microsmall.csv
strategy: multibagger
top_n: 20
capital: 100000
purchase_date: "2026-01-01"
rebalance_tolerance_pct: 0.25
hysteresis_rank_buffer: 5
sentry: true
broker: zerodha
